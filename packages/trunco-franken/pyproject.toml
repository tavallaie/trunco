[project]
name = "trunco-franken"
version = "0.1.0"
description = "Franken UI integration plugin for Trunco."
readme = "README.md"
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "trunco-core==0.3.2",
]

[tool.setuptools]
namespace_packages = ["trunco"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

