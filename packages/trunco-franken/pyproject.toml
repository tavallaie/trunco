[project]
name = "trunco-franken"
version = "0.1.0"
description = "Franken UI integration plugin for Trunco."
readme = "README.md"
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "trunco",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
trunco = { workspace = true }
