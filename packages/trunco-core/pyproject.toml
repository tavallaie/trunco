[project]
name = "trunco-core"
version = "0.3.1"
description = "An agile, powerful Python framework for creating dynamic UIs with seamless web integration."
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"

[tool.setuptools]
namespace_packages = ["trunco"]

[tool.hatch.build.targets.wheel]
packages = ["src/trunco"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
