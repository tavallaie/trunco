[project]
name = "trunco"
version = "0.3.2"
description = "An agile, powerful Python framework for creating dynamic UIs with seamless web integration."
readme = "README.md"
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "trunco-core==0.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.uv.sources]
trunco-core = { workspace = true }
