[project]
name = "trunco"
version = "0.5.1"
description = "An agile, powerful Python framework for creating dynamic UIs with seamless web integration."
authors = [{ name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
alpine = []
htmx = []
uikit = []
daisy = []
zbuild = []
franken = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trunco"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"