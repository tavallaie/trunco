version = 1
requires-python = ">=3.12"

[manifest]
members = [
    "trunco",
    "trunco-core",
    "trunco-franken",
    "trunco-workspace",
]

[[package]]
name = "trunco"
version = "0.3.1"
source = { editable = "packages/trunco" }
dependencies = [
    { name = "trunco-core" },
]

[package.metadata]
requires-dist = [{ name = "trunco-core", editable = "packages/trunco-core" }]

[[package]]
name = "trunco-core"
version = "0.3.1"
source = { editable = "packages/trunco-core" }

[[package]]
name = "trunco-franken"
version = "0.1.0"
source = { editable = "packages/trunco-franken" }
dependencies = [
    { name = "trunco-core" },
]

[package.metadata]
requires-dist = [{ name = "trunco-core", editable = "packages/trunco-core" }]

[[package]]
name = "trunco-workspace"
version = "0.1.0"
source = { editable = "." }
